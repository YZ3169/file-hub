server:
  port: ${SERVER_PORT:8081}
  tomcat:
    max-swallow-size: -1          # 大文件上传中断时不要把连接直接掐掉

spring:
  application:
    name: file-hub
  servlet:
    multipart:
      enabled: true
      # 只比 chunk-size（5MB）大 1MB：接口一次只收一个分片，没必要给 512MB 的余量，
      # 否则一个超大请求就能把 Tomcat 的临时目录/堆打满。改 chunk-size 时同步调整这里。
      max-file-size: 6MB
      max-request-size: 6MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 容器里用 FILE_HUB_* 覆盖；默认值仍是本机 3306
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/file_hub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true}
    username: ${MYSQL_USER:root}
    # 数据库口令不落盘：启动前先设好环境变量 MYSQL_PWD（本机实测用 set MYSQL_PWD=... 即可）
    password: ${MYSQL_PWD}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

file-hub:
  # 存储根目录。files/ 放合并后的成品，chunks/ 放上传中的临时分片
  root: ${FILE_HUB_ROOT:D:/Projects/file-hub-data}
  # 单个分片大小（字节）。前端按这个值切片，服务端只做校验，不相信前端算出来的数量
  chunk-size: 5242880            # 5MB
  # 上传任务多久没动静就认为可以清理（分钟）
  upload-expire-minutes: 1440
  # files/ 下没有任何数据库记录引用的成品文件，超过这个时长才回收（小时）。
  # 给足 7 天，避免数据库临时不可用/配置指错库时误删仍在使用的文件。
  orphan-file-grace-hours: 168
  # 定时回收废弃任务 / 残留临时文件的间隔
  cleanup-interval-ms: 600000
  cleanup-initial-delay-ms: 60000

  # 关键词搜索实现。MySQL 8 用 ngram 全文索引；桌面版 H2 没有 FULLTEXT，关掉后回退 LIKE。
  search:
    fulltext-enabled: true

  # 登录 / 会话 / 管理员初始化
  auth:
    # 会话有效期（小时）。Token 是不透明随机串，数据库只存 SHA-256。
    token-ttl-hours: 168
    # 浏览器下载票据有效期（分钟）；票据绑定 file + user，脚本仍可直接用 Bearer。
    ticket-ttl-minutes: 5
    # 演示环境开放注册；生产可关掉，只让管理员建号。
    allow-registration: true
    # 启动时如果提供了密码，就创建/提升这个账号为 ADMIN。
    # 密码绝不写进配置文件，用环境变量 FILE_HUB_ADMIN_PASSWORD 注入。
    admin-username: ${FILE_HUB_ADMIN_USER:admin}
    admin-password: ${FILE_HUB_ADMIN_PASSWORD:}
    # 桌面版单人使用：第一个注册的账号直接给 ADMIN，不用另配管理员密码。
    # 服务器模式保持 false，管理员仍由上面的环境变量初始化。
    first-user-admin: false

  # 多实例部署。默认 false：单进程内锁 + Caffeine 限流，不需要 Redis。
  # 打开后锁和限流都切到 Redis，所有实例必须指向同一个共享存储目录（root）和同一个 Redis。
  cluster:
    enabled: false
    redis-address: ${FILE_HUB_REDIS_ADDRESS:redis://127.0.0.1:6379}
    redis-database: 0
    key-prefix: "filehub:"

  # 提取码分享：4 位码 + 失败锁定；分享主战场是服务器/Docker 部署。
  share:
    # 连续输错多少次锁定（真正的防爆破在每分享的锁定，不在 IP 限流）
    code-max-attempts: 10
    # 锁定时长（分钟）
    code-lock-minutes: 15
    # 提取码的服务器端 pepper：设置后 BCrypt 摘要的是 HMAC(code, pepper)。
    # 4 位码只有 100 万种，单靠 BCrypt 被拖库后离线穷举很快；密钥放环境变量
    # （FILE_HUB_SHARE_PEPPER）而不进数据库。留空 = 不用，兼容已有数据；
    # 修改该值会让已有分享的提取码全部失效。
    code-pepper: ${FILE_HUB_SHARE_PEPPER:}
    # 单个文件最多同时有几个有效分享；每个用户最多同时有几个（防止刷行 + BCrypt 编码）
    max-active-per-file: 5
    max-active-per-owner: 100
    # 已取消/过期分享保留多少天后清理
    stale-retention-days: 7
    cleanup-interval-ms: 1800000
    cleanup-initial-delay-ms: 60000

  # 限流默认值；本地 Caffeine 固定窗口，集群模式换 Redis 计数。
  rate-limit:
    enabled: true
    login-per-minute: 10
    register-per-hour: 20
    init-per-minute: 60
    chunk-per-minute: 2400
    api-per-minute: 600
    # 匿名提取码校验：按 IP + 分享 token 计数，NAT 后多人同时提取不互相拖累
    share-per-minute: 30
    # 匿名提取的总闸：单个 IP 每分钟上限。token 的写法由客户端控制，不能只按 token 分桶
    share-global-per-minute: 120
    # 默认不信任 X-Forwarded-For；只有放在可信反向代理后面时才打开。
    trust-forwarded-headers: false

# 运维端点：health 公开；metrics/prometheus 在 SecurityConfig 里要求 ADMIN
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: file-hub

info:
  app:
    name: file-hub
    version: 1.0.2

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    # 本地默认 debug；容器/生产用 FILE_HUB_LOG_LEVEL=info 降噪
    com.yuzhuo.filehub: ${FILE_HUB_LOG_LEVEL:debug}
