server:
  port: 8081
  tomcat:
    max-swallow-size: -1          # 大文件上传中断时不要把连接直接掐掉

spring:
  application:
    name: file-hub
  servlet:
    multipart:
      enabled: true
      # 只比 chunk-size（5MB）大 1MB：接口一次只收一个分片，没必要给 512MB 的余量，
      # 否则一个超大请求就能把 Tomcat 的临时目录/堆打满。改 chunk-size 时同步调整这里。
      max-file-size: 6MB
      max-request-size: 6MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/file_hub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
    username: ${MYSQL_USER:root}
    # 数据库口令不落盘：启动前先设好环境变量 MYSQL_PWD（本机实测用 set MYSQL_PWD=... 即可）
    password: ${MYSQL_PWD}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

file-hub:
  # 存储根目录。files/ 放合并后的成品，chunks/ 放上传中的临时分片
  root: D:/Projects/file-hub-data
  # 单个分片大小（字节）。前端按这个值切片，服务端只做校验，不相信前端算出来的数量
  chunk-size: 5242880            # 5MB
  # 上传任务多久没动静就认为可以清理（分钟）
  upload-expire-minutes: 1440
  # files/ 下没有任何数据库记录引用的成品文件，超过这个时长才回收（小时）。
  # 给足 7 天，避免数据库临时不可用/配置指错库时误删仍在使用的文件。
  orphan-file-grace-hours: 168
  # 定时回收废弃任务 / 残留临时文件的间隔
  cleanup-interval-ms: 600000
  cleanup-initial-delay-ms: 60000

logging:
  level:
    com.yuzhuo.filehub: debug
