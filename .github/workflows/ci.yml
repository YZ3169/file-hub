name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: mvn test
        run: mvn -B test

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build

  e2e:
    name: 端到端验收
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          # 只用于 CI 里的一次性实例，不是任何真实环境的口令
          MYSQL_ROOT_PASSWORD: filehub-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pfilehub-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # e2e 脚本用 python 解析 JSON；runner 上默认只有 python3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 建库建表
        run: mysql -h 127.0.0.1 -uroot -pfilehub-ci < src/main/resources/schema.sql

      - name: 打包（跳过单元测试，backend 任务已经跑过）
        run: mvn -B package -DskipTests

      - name: 启动服务并跑 E2E
        env:
          MYSQL_PWD: filehub-ci
          FILE_HUB_ROOT: ${{ runner.temp }}/file-hub-data
        run: |
          java -Dfile.encoding=UTF-8 -jar target/file-hub-1.0.0.jar \
            --file-hub.root="$FILE_HUB_ROOT" \
            > "$RUNNER_TEMP/app.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8081/api/file/config > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8081/api/file/config
          echo
          bash scripts/e2e-test.sh

      - name: 失败时输出服务端日志
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/app.log"
