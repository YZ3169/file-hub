name: Release Desktop

# 打 v* 标签时构建 Windows 桌面版并自动创建 GitHub Release。
# 也可以手动 workflow_dispatch 只构建、把产物挂在 Actions 里检查。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建 Windows 安装包并发布
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装前端依赖
        working-directory: web
        run: npm ci

      - name: 单元测试
        run: mvn -B test

      # 不装 WiX（安装器要管理员和 .NET 3.5），直接用官方便携版
      - name: 下载 WiX 3.14 便携版
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wix314.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'wix314'
          Invoke-WebRequest -Uri 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          Get-Item (Join-Path $dir 'candle.exe') | Select-Object FullName

      - name: 构建 jar、免安装目录与 MSI
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout 2>/dev/null | tr -d '\r' | tail -n1)"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "标签 $GITHUB_REF_NAME 与 pom.xml 版本 $VERSION 不一致" >&2
            exit 1
          fi
          export WIX_BIN="$(cygpath -u "$RUNNER_TEMP")/wix314"
          bash scripts/package-desktop.sh
          powershell -NoProfile -Command "Compress-Archive -Path 'build/desktop/dist/FileHub' -DestinationPath 'build/desktop/dist/FileHub-$VERSION-portable.zip' -Force"
          ls -lh build/desktop/dist/*.msi build/desktop/dist/*-portable.zip

      - name: 手动触发时上传产物
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: FileHub-desktop
          path: |
            build/desktop/dist/*.msi
            build/desktop/dist/*-portable.zip
          retention-days: 14

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: FileHub 桌面版 ${{ github.ref_name }}
          body: |
            Windows 10/11 x64 桌面版：内置 H2 数据库和 JRE，只监听 `127.0.0.1:18080`，
            不需要安装 MySQL / Docker / Java。

            - `FileHub-${{ env.APP_VERSION }}.msi`：推荐。按用户安装，不需要管理员权限，
              从开始菜单启动，卸载只删程序、不删数据。
            - `FileHub-${{ env.APP_VERSION }}-portable.zip`：免安装，解压后双击 `FileHub.exe`。

            首次运行可能被 SmartScreen 提示「未知发布者」（安装包未做代码签名）：
            点「更多信息 → 仍要运行」即可。

            数据保存在 `%LOCALAPPDATA%\FileHubData`；第一次注册的账号自动成为管理员。
            关闭浏览器不会退出程序，请用系统托盘的 FileHub 图标退出。
          files: |
            build/desktop/dist/*.msi
            build/desktop/dist/*-portable.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
